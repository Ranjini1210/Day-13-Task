<!DOCTYPE html>
<html>
    <head>
        <title>Profile Card</title>
        <style>
            .card{
                width:200px;
                padding:20px;
                border:2px solid blue;
                box shawdow:5px 5px 5px red;
                text align: center;
                transition:transform 0.4s;
                
            }
            .card:hover{
                transform:scale(1.05);
            }
            .img-placeholder{
                width:100px;
                height:100px;
                background:  url("https://picsum.photos/100/200") no-repeat ;
                border-radius:50%;
                margin:0 auto 10px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="img-placeholder"></div>
            <h3>Virat</h3>
            <p>UX DESIGNER</p>
            <button>Follow</button>
        </div>

    </body>
</html>
